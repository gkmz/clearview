name: Xcode - Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build default scheme using xcodebuild
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project container and scheme
        run: |
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$`"
          else
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$`"
          fi

          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "$filetype_parameter" > filetype_parameter
          echo "$file_to_build" > file_to_build

          if [ "$filetype_parameter" = "workspace" ]; then
            scheme_list=$(xcodebuild -list -json -workspace "$file_to_build" | tr -d "\n")
          else
            scheme_list=$(xcodebuild -list -json -project "$file_to_build" | tr -d "\n")
          fi

          default=$(echo "$scheme_list" | ruby -e "require 'json'; data = JSON.parse(STDIN.read); puts data.dig('project', 'schemes', 0) || data.dig('workspace', 'schemes', 0)")
          echo "$default" > default
          echo "Using $filetype_parameter: $file_to_build"
          echo "Using default scheme: $default"

      - name: Build
        run: |
          scheme=$(cat default)
          filetype_parameter=$(cat filetype_parameter)
          file_to_build=$(cat file_to_build)
          xcodebuild clean build -scheme "$scheme" -"$filetype_parameter" "$file_to_build"
